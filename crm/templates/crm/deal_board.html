{% extends "crm/base.html" %}
{% block content %}
<div class="row"><h1 style="margin:0">Deals</h1><span style="flex:1"></span><a class="btn" href="{% url 'deal_create' %}">New deal</a></div>
<div class="board">{% for col in columns %}<div class="col"><h3>{{ col.label }} · {{ col.deals|length }}</h3>
{% for d in col.deals %}<div class="deal"><a href="{{ d.get_absolute_url }}"><b>{{ d.title }}</b></a><br><small>{{ d.contact }} · ${{ d.value|floatformat:"0g" }}</small>
<form method="post" action="{% url 'deal_stage' d.pk %}" style="margin-top:6px">{% csrf_token %}<input type="hidden" name="next" value="board">
<select name="stage" onchange="this.form.submit()" aria-label="Move deal">{% for v,l in stages %}<option value="{{ v }}" {% if v == d.stage %}selected{% endif %}>{{ l }}</option>{% endfor %}</select><noscript><button>Move</button></noscript></form></div>{% endfor %}</div>{% endfor %}</div>
{% endblock %}
